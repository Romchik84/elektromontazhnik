  replaceRequired("    <!-- ===================== FORMULAS ===================== -->", "<section class=\"panel\" id=\"tab-loop\">\n  <h2>Петля фаза-ноль</h2>\n  <p class=\"lead\">Введите результат измерения и параметры автоматического выключателя. Калькулятор покажет измерительный критерий, расчётный предел и ориентировочный ток короткого замыкания.</p>\n  <div class=\"field-grid\">\n    <div class=\"field\">\n      <label>Измеренное сопротивление петли Zs, Ом</label>\n      <input type=\"text\" id=\"loop-zs\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Например, 0,80\">\n    </div>\n    <div class=\"field\">\n      <label>Номинальное фазное напряжение U₀, В</label>\n      <input type=\"text\" id=\"loop-u0\" inputmode=\"decimal\" autocomplete=\"off\" value=\"230\">\n    </div>\n    <div class=\"field\">\n      <label>Характеристика автомата</label>\n      <select id=\"loop-curve\">\n        <option value=\"B\">B</option>\n        <option value=\"C\" selected>C</option>\n        <option value=\"D\">D</option>\n      </select>\n    </div>\n    <div class=\"field\">\n      <label>Номинальный ток автомата In, А</label>\n      <select id=\"loop-in\">\n        <option value=\"6\">6 А</option>\n        <option value=\"10\">10 А</option>\n        <option value=\"13\">13 А</option>\n        <option value=\"16\" selected>16 А</option>\n        <option value=\"20\">20 А</option>\n        <option value=\"25\">25 А</option>\n        <option value=\"32\">32 А</option>\n        <option value=\"40\">40 А</option>\n        <option value=\"50\">50 А</option>\n        <option value=\"63\">63 А</option>\n      </select>\n    </div>\n  </div>\n  <div class=\"result\" id=\"loop-result\" aria-live=\"polite\">\n    <div class=\"row\"><span class=\"k\">Оценка</span><span class=\"v\" id=\"loop-status\">Введите измеренное Zs</span></div>\n    <div class=\"row\"><span class=\"k\">Порог измеренного значения, ⅔ × U₀ / Ia</span><span class=\"v\" id=\"loop-measured-limit\">—</span></div>\n    <div class=\"row\"><span class=\"k\">Расчётный предел, U₀ / Ia</span><span class=\"v\" id=\"loop-design-limit\">—</span></div>\n    <div class=\"row\"><span class=\"k\">Ток Ia для срабатывания автомата</span><span class=\"v\" id=\"loop-ia\">—</span></div>\n    <div class=\"row\"><span class=\"k\">Ориентировочный ток КЗ U₀ / Zs</span><span class=\"v\" id=\"loop-ik\">—</span></div>\n    <div class=\"row\"><span class=\"k\">Введённое сопротивление</span><span class=\"v\" id=\"loop-zs-value\">—</span></div>\n  </div>\n  <div class=\"note\">\n    <span class=\"tag\">Границы оценки</span>\n    <span>Зелёная зона — измеренное Zs не выше ⅔ × U₀ / Ia. Жёлтая зона — выше этого порога, но не выше U₀ / Ia: требуется более подробная оценка, это не автоматический вывод о несоответствии. Красная зона — выше U₀ / Ia: простое условие автоматического отключения не выполняется.</span>\n  </div>\n  <div class=\"note\">\n    <span class=\"tag\">Методика</span>\n    <span>Расчёт предназначен для сети TN и автоматических выключателей с характеристиками B, C или D по ГОСТ IEC 60898-1. Для консервативной оценки Ia принимается по верхней границе мгновенного расцепления: B = 5 × In, C = 10 × In, D = 20 × In. Порог измеренного значения ⅔ × U₀ / Ia применяется по ГОСТ Р 50571.16-2019. При превышении этого порога стандарт предусматривает дополнительную оценку с учётом сопротивления источника, проводников и их нагрева. Для TT, предохранителей, УЗО как основного защитного аппарата и устройств с другими характеристиками нужен отдельный расчёт. Результат не заменяет протокол измерений и проверку специалистом.</span>\n  </div>\n  <button class=\"btn\" style=\"background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);\" onclick=\"resetLoop()\">Сбросить значения</button>\n</section>\n\n    <!-- ===================== FORMULAS ===================== -->");
  replaceRequired("/* ---------------- OHM'S LAW ---------------- */", "/* ---------------- PHASE-NEUTRAL LOOP ---------------- */\nfunction readLoopNumber(id){\n  const raw=String(document.getElementById(id).value??'').trim().replace(/\\s+/g,'').replace(',','.');\n  return raw===''?NaN:Number(raw);\n}\nfunction calcLoop(){\n  const measured=readLoopNumber('loop-zs');\n  const u0=readLoopNumber('loop-u0');\n  const curve=document.getElementById('loop-curve').value;\n  const nominal=Number(document.getElementById('loop-in').value);\n  const multiplier={B:5,C:10,D:20}[curve];\n  const status=document.getElementById('loop-status');\n  const result=document.getElementById('loop-result');\n  const valid=Number.isFinite(u0)&&u0>0&&Number.isFinite(measured)&&measured>0&&Number.isFinite(nominal)&&nominal>0;\n  if(!valid){\n    status.textContent='Введите измеренное Zs больше 0';\n    status.style.color='var(--text-dim)';\n    ['loop-measured-limit','loop-design-limit','loop-ia','loop-ik','loop-zs-value'].forEach(id=>document.getElementById(id).textContent='—');\n    result.style.borderColor='var(--border)';\n    return;\n  }\n  const ia=multiplier*nominal;\n  const designLimit=u0/ia;\n  const measuredLimit=(2/3)*designLimit;\n  const estimatedCurrent=u0/measured;\n  const fmtOhm=n=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:3,maximumFractionDigits:3}).format(n)+' Ом';\n  const fmtAmp=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n)+' А';\n  document.getElementById('loop-measured-limit').textContent=fmtOhm(measuredLimit);\n  document.getElementById('loop-design-limit').textContent=fmtOhm(designLimit);\n  document.getElementById('loop-ia').textContent=fmtAmp(ia)+' ('+multiplier+' × '+nominal+' А)';\n  document.getElementById('loop-ik').textContent=fmtAmp(estimatedCurrent);\n  document.getElementById('loop-zs-value').textContent=fmtOhm(measured);\n  if(measured<=measuredLimit){\n    status.textContent='В пределах критерия измерения';\n    status.style.color='var(--green)';\n    result.style.borderColor='var(--green)';\n  }else if(measured<=designLimit){\n    status.textContent='Требуется дополнительная оценка';\n    status.style.color='var(--yellow)';\n    result.style.borderColor='var(--yellow)';\n  }else{\n    status.textContent='Выше расчётного предела';\n    status.style.color='var(--red)';\n    result.style.borderColor='var(--red)';\n  }\n}\nfunction resetLoop(){\n  document.getElementById('loop-zs').value='';\n  document.getElementById('loop-u0').value='230';\n  document.getElementById('loop-curve').value='C';\n  document.getElementById('loop-in').value='16';\n  calcLoop();\n}\n['loop-zs','loop-u0'].forEach(id=>document.getElementById(id).addEventListener('input',calcLoop));\n['loop-curve','loop-in'].forEach(id=>document.getElementById(id).addEventListener('change',calcLoop));\ncalcLoop();\n\n"+"/* ---------------- OHM'S LAW ---------------- */");

та нагрузки.</span></div>\n        <div class=\"relay-setting\"><strong>rEP — защита от частых срабатываний</strong><span>3 по умолчанию; диапазон 1–5. При достижении порога повторных срабатываний реле временно не восстанавливает питание.</span></div>\n        <div class=\"relay-setting\"><strong>bri — яркость ожидания</strong><span>100% по умолчанию; диапазон 0–100%.</span></div>\n        <p><strong>Как изменить:</strong> кнопкой «☰» входить и перемещаться по меню; «+» включает редактирование; «+» и «−» меняют значение. Сохранение — кнопкой «☰» или автоматически после 10 секунд без нажатий.</p>\n        <p><strong>Пределы Umin/Umax:</strong> краткое нажатие «−» или «+», затем корректировка кнопками и сохранение кнопкой «☰» либо ожиданием 10 секунд.</p>\n      </div>\n    </details>\n\n    <details class=\"relay-accordion\">\n      <summary>Варианты линейки Welrok D2</summary>\n      <div class=\"relay-content\">\n        <p>D2 и D2 red выпускаются в вариантах на 32, 40, 50 и 63 А; D2 bk — 63 А; D2 TN — вариант с транзитом нуля. Перед подключением проверяйте точное обозначение на корпусе: D2 и D2 TN подключаются по разным схемам.</p>\n      </div>\n    </details>\n  </div>\n\n  <div class=\"relay-model-card\" id=\"relay-model-novatek\" hidden>\n    <h3>Новатек-Электро РН-113</h3>\n    <p class=\"lead\">Однофазное реле на 230 В с максимальным коммутируемым током 32 А.</p>\n    <div class=\"relay-spec-grid\">\n      <div><span>Номинальное напряжение</span><strong>230 В</strong></div>\n      <div><span>Максимальный ток</span><strong>32 А</strong></div>\n      <div><span>Umin</span><strong>160–220 В</strong></div>\n      <div><span>Umax</span><strong>230–280 В</strong></div>\n      <div><span>Задержка включения</span><strong>5–900 с</strong></div>\n      <div><span>Габариты</span><strong>90 × 66,3 × 52,6 мм</strong></div>\n    </div>\n    <div class=\"relay-content\">\n      <p>У РН-113 есть отдельные типовые схемы в официальной документации производителя. Не переносите       currentField.innerHTML='<label for="loop-measured-ik">Измеренный ток КЗ Ik, А</label><input type="text" id="loop-measured-ik" inputmode="decimal" autocomplete="off" placeholder="Например, 287">';

      grid.insertBefore(currentField,zsField.nextSibling);

      const modeSelect=document.getElementById('loop-input-mode');
      const currentInput=document.getElementById('loop-measured-ik');
      const parse=value=>{
        const raw=String(value??'').trim().replace(/\s+/g,'').replace(',','.');
        return raw===''?NaN:Number(raw);
      };
      const syncFromCurrent=()=>{
        if(modeSelect.value!=='ik') return;
        const current=parse(currentInput.value);
        const u0=parse(u0Input.value);
        zsInput.value=Number.isFinite(current)&&current>0&&Number.isFinite(u0)&&u0>0?(u0/current).toFixed(6):'';
        zsInput.dispatchEvent(new Event('input',{bubbles:true}));
        if(!Number.isFinite(current)||current<=0){
          document.getElementById('loop-status').textContent='Введите измеренный ток КЗ больше 0';
        }
      };
      const applyMode=()=>{
        const currentMode=modeSelect.value==='ik';
        zsField.style.display=currentMode?'none':'';
        currentField.style.display=currentMode?'':'none';
        if(currentMode) syncFromCurrent();
        else zsInput.dispatchEvent(new Event('input',{bubbles:true}));
      };
      modeSelect.addEventListener('change',applyMode);
      currentInput.addEventListener('input',syncFromCurrent);
      u0Input.addEventListener('input',()=>{if(modeSelect.value==='ik') syncFromCurrent();});
      applyMode();

      window.resetLoop=function(){
        zsInput.value='';
        currentInput.value='';
        u0Input.value='230';
        document.getElementById('loop-curve').value='C';
        document.getElementById('loop-in').value='16';
        modeSelect.value='zs';
        applyMode();
      };
      const ikLabel=loopPanel.querySelector('#loop-ik')?.closest('.row')?.querySelector('.k');

    }

    tomzn.hidden=true;
    tomzn.innerHTML=`

      <p class="lead">Под общим названием TOVPD1 выпускаются разные версии. Ниже приведены конкретные исполнения; диапазоны и меню одной версии нельзя автоматически переносить на другую.</p>

          <a href="https://tomzn.com/product/tomzn-voltage-protector-ac230v-63a-adjustable-over-under-voltage-protective-overload-protection-ocp-auto-reconnect-u-i-p-display/" target="_blank" rel="noopener">Официальная страница TOMZN TOVPD1-63VAE-Z</a><br>

    relayCardsRoot.append(zubr,tomzn);
    const tomznSelect=document.getElementById('tomzn-model');
    const tomznVariants={

      Object.entries(tomznVariants).forEach(([key,card])=>{if(card) card.hidden=key!==tomznSelect.value;});

    const relayModelCards={
      welrok:document.getElementById('relay-model-welrok'),

    };

      Object.entries(relayModelCards).forEach(([key,card])=>{if(card) card.hidden=key!==relaySelect.value;});

 }catch(e){

 }
